<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept A — Editorial Swiss</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@700,600,500,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "General Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #f4f2ee;
    color: #0b0b0b;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .concept-tag {
    position: fixed; top: 16px; left: 16px; z-index: 5;
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    background: #0b0b0b; color: #f4f2ee; padding: 6px 10px; border-radius: 999px;
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px clamp(20px, 4vw, 56px) 0;
    font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  }
  .bar span:last-child { color: #8c8a86; }
  main { flex: 1; display: flex; align-items: center; padding: 0 clamp(20px, 4vw, 56px); }
  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(3.4rem, 11vw, 11.5rem);
    line-height: 0.86;
    letter-spacing: -0.035em;
  }
  h1 .accent { color: #e21b1b; }
  .row { display: flex; align-items: flex-end; gap: 24px; }
  .row .rule { flex: 1; height: 1px; background: #0b0b0b; margin-bottom: 14px; }
  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 clamp(20px, 4vw, 56px) clamp(28px, 5vw, 56px);
    gap: 24px;
  }
  footer p { max-width: 320px; font-size: 15px; line-height: 1.5; color: #4a4946; margin: 0; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600;
    border-bottom: 1.5px solid #0b0b0b; padding-bottom: 3px;
  }
</style>
</head>
<body>
  <div class="concept-tag">Концепция A — Editorial Swiss</div>

  <div class="bar">
    <span>Malik Sultanbiev</span>
    <span>Brand Designer — 2026</span>
  </div>

  <main>
    <div style="width:100%">
      <h1>Brands are<br>not designed.<br><span class="accent">They</span> are built.</h1>
      <div class="row"><div class="rule"></div></div>
    </div>
  </main>

  <footer>
    <p>Identity systems and visual strategy for brands that intend to be remembered.</p>
    <a class="cta">Start a brand project →</a>
  </footer>
</body>
</html>
