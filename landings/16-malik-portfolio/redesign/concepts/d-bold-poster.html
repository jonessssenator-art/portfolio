<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Концепция D — Bold Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Manrope", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #ff5a36;
    color: #191106;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .concept-tag {
    position: fixed; top: 16px; left: 16px; z-index: 5;
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    background: #191106; color: #ff5a36; padding: 6px 10px; border-radius: 999px;
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px clamp(20px, 4vw, 56px) 0;
    font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  main {
    flex: 1; display: grid; grid-template-columns: 1.5fr 1fr; align-items: center;
    gap: 24px;
    padding: 0 clamp(20px, 4vw, 56px);
  }
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.6rem, 7.6vw, 6.4rem);
    line-height: 0.98;
    letter-spacing: -0.03em;
  }
  .badge {
    justify-self: end;
    width: min(78%, 340px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #191106;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    border: 6px solid #191106;
  }
  .badge img {
    width: 130%;
    filter: sepia(1) saturate(3) hue-rotate(-10deg) brightness(0.9) contrast(1.1);
    mix-blend-mode: screen;
  }
  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 clamp(20px, 4vw, 56px) clamp(28px, 5vw, 56px);
    gap: 24px;
  }
  footer p { max-width: 340px; font-size: 15px; font-weight: 500; line-height: 1.5; margin: 0; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em;
    background: #191106; color: #ff5a36;
    padding: 16px 26px; border-radius: 999px;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .badge { justify-self: start; width: 140px; order: -1; }
    footer { flex-direction: column; align-items: flex-start; gap: 20px; }
  }
</style>
</head>
<body>
  <div class="concept-tag">Концепция D — Bold Poster</div>
  <div class="bar">
    <span>Малик Султанбиев</span>
    <span>Бренд-дизайнер</span>
  </div>
  <main>
    <h1>Айдентика,<br>которая<br>продаёт.</h1>
    <div class="badge"><img src="../../assets/portrait-pixel.svg" alt=""></div>
  </main>
  <footer>
    <p>Делаю бренды заметными и растущими — не только красивыми.</p>
    <a class="cta">Обсудить проект →</a>
  </footer>
</body>
</html>
