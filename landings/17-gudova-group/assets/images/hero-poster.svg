<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a1d20" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Pure-CSS assembly animation, self-contained in the file so it plays
       identically whether this SVG is used as an <img> (mobile / no-WebGL /
       reduced-motion fallback) or inline. No JS required. Base attribute
       values below are the fully-built end state, so anything that can't
       run the animation (no animation support, prefers-reduced-motion, a
       media feature the browser doesn't recognize) still renders the
       finished building instead of a broken/half-drawn one. -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .foundation{opacity:0;transform:translateY(6px);transform-box:fill-box;transform-origin:center;animation:riseFade .5s ease-out .05s forwards;}

      .column{stroke-dasharray:360;stroke-dashoffset:360;animation:drawUp .7s ease-out forwards;}
      .column-1{animation-delay:.25s;}
      .column-2{animation-delay:.32s;}
      .column-3{animation-delay:.39s;}
      .column-4{animation-delay:.46s;}

      .slab{stroke-dasharray:828;stroke-dashoffset:828;opacity:0;animation:drawSlab .5s ease-out forwards;}
      .slab-1{animation-delay:.85s;}
      .slab-2{animation-delay:1.05s;}
      .slab-3{animation-delay:1.25s;}

      .roofline{stroke-dasharray:466;stroke-dashoffset:466;animation:drawUp .6s ease-out 1.65s forwards;}

      .finishing{opacity:0;animation:riseFade .4s ease-out 2.15s forwards;}
      .axis-crosshair{--final-opacity:.6;}
    }

    @keyframes drawUp{to{stroke-dashoffset:0;}}
    @keyframes drawSlab{to{stroke-dashoffset:0;opacity:.85;}}
    @keyframes riseFade{to{opacity:var(--final-opacity,1);transform:translateY(0);}}
  </style>

  <rect width="800" height="800" fill="#0A0B0C"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- building + frame decorations scaled up ~15% and shifted up (was
       reading too small / too low-center); x-translate of -60 keeps the
       scale centered on the artwork's own midpoint (x=400) so left/right
       margins stay equal instead of the drawing drifting toward one edge -->
  <g transform="translate(-60,-100) scale(1.15)">

  <!-- foundation -->
  <rect class="foundation" x="180" y="620" width="440" height="24" fill="none" stroke="#C9773D" stroke-width="1.6"/>

  <!-- columns -->
  <g stroke="#5D6267" stroke-width="1.6">
    <line class="column column-1" x1="230" y1="620" x2="230" y2="260"/>
    <line class="column column-2" x1="340" y1="620" x2="340" y2="260"/>
    <line class="column column-3" x1="460" y1="620" x2="460" y2="260"/>
    <line class="column column-4" x1="570" y1="620" x2="570" y2="260"/>
  </g>

  <!-- floor slabs (bottom to top) -->
  <g fill="none" stroke="#C9773D" stroke-width="1.4">
    <rect class="slab slab-1" x="200" y="500" width="400" height="14" opacity="0.85"/>
    <rect class="slab slab-2" x="200" y="380" width="400" height="14" opacity="0.85"/>
    <rect class="slab slab-3" x="200" y="260" width="400" height="14" opacity="0.85"/>
  </g>

  <!-- roof line -->
  <path class="roofline" d="M190 260 L400 160 L610 260" fill="none" stroke="#F4F1EA" stroke-width="1.6"/>

  <!-- axis crosshair -->
  <g class="finishing axis-crosshair" stroke="#5D6267" stroke-width="1" opacity="0.6">
    <line x1="400" y1="90" x2="400" y2="700"/>
    <line x1="90" y1="400" x2="710" y2="400"/>
  </g>

  <!-- corner registration marks -->
  <g class="finishing" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round">
    <path d="M110 90 H90 V110" fill="none"/>
    <path d="M690 90 H710 V110" fill="none"/>
    <path d="M110 710 H90 V690" fill="none"/>
  </g>
  <path class="finishing" d="M690 710 H710 V690" fill="none" stroke="#C9773D" stroke-width="2" stroke-linecap="round"/>
  <circle class="finishing" cx="400" cy="400" r="3" fill="#C9773D"/>
  </g>
</svg>
